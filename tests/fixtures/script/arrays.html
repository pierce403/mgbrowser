<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Local array-storage fixture</title></head>
<body>
<h1>Local prepaid-array form fixture</h1>
<p>This is an authored localhost storage test, not a public search service.</p>
<p id="status">The bounded worker must create the arrays before building this form.</p>
<script>
// Six independent 10,000-slot arrays fit only when moved storage is paid once.
// Each array keeps real holes, and every allocation remains cumulative.
var buffers = [];
for (var index = 0; index < 6; index++) {
    var buffer = Array(10000);
    buffer[0] = index;
    buffers.push(buffer);
}
if (buffers.length !== 6 || buffers[5][0] !== 5 || 1 in buffers[5]) {
    throw 'Array storage semantics changed';
}
function create(tag) { return document.createElement(tag); }
var form = create('form');
form.action = '/search';
form.method = 'get';
var label = create('label');
label.textContent = 'Local query ';
var query = create('input');
query.name = 'q';
query.type = 'text';
var hidden = create('input');
hidden.type = 'hidden';
hidden.name = 'source';
hidden.value = 'fixture';
var submit = create('button');
submit.type = 'submit';
submit.textContent = 'Search local array-storage fixture';
form.appendChild(label);
form.appendChild(query);
form.appendChild(hidden);
form.appendChild(submit);
document.body.appendChild(form);
document.title = 'Prepaid-array local fixture';
document.getElementById('status').textContent = 'Six independent arrays and real form controls fit within the unchanged allocation budget.';
</script>
<noscript><p>Enable the experimental script worker to create this local form.</p></noscript>
</body>
</html>
