<!doctype html><html><head><title>Authored Window error fixture</title></head><body>
<h1>Authored Window errors with retained events</h1>

<div id="controls"></div><div id="parking"></div>

var starts = 1;
var retainedError = { proof: 'owned thrown object' };
var savedError, propertyMessage, propertyCalls = 0, listenerCalls = 0;
var checkpointDone = false, errorOrder = ['script'];
Promise.resolve().then(function () { errorOrder.push('script-microtask'); });

  if (arguments.length !== 5 || this !== window || typeof message !== 'string' || !message ||

    throw new Error('Wrong Window onerror arguments or retained identity');

    throw new Error('Wrong checkpoint order before Window onerror');

  errorOrder.push('property');

};

    throw new Error('Window property handler did not precede ordinary error listener');
