<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Local parameter-storage fixture</title></head>
<body>
<h1>Local parameter-copy form fixture</h1>
<p>This is an authored localhost storage test, not a public search service.</p>
<p id="status">The bounded worker must bind an independent parameter copy before creating this form.</p>
<script>
function build(unusedBuffer) {
    // The input and independent parameter buffer are both paid for. Do not read
    // the large parameter here: an identifier read would create another copy.
    var form = document.createElement('form');
    form.action = '/search';
    form.method = 'get';
    var label = document.createElement('label');
    label.textContent = 'Local query ';
    var query = document.createElement('input');
    query.name = 'q';
    query.type = 'text';
    var hidden = document.createElement('input');
    hidden.type = 'hidden';
    hidden.name = 'source';
    hidden.value = 'fixture';
    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = 'Search local parameter-storage fixture';
    form.appendChild(label);
    form.appendChild(query);
    form.appendChild(hidden);
    form.appendChild(submit);
    document.body.appendChild(form);
    document.title = 'Parameter-copy local fixture';
    document.getElementById('status').textContent = 'The original argument, independent parameter copy and real controls fit within the unchanged allocation budget.';
}
// 9,999 separators, each 75 ASCII units, produce a 749,925-unit owned string.
build(Array(10000).join('012345678901234567890123456789012345678901234567890123456789012345678901234'));
</script>
<noscript><p>Enable the experimental script worker to create this local form.</p></noscript>
</body>
</html>
