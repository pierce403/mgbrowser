name: Experimental preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and fixture display
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core desktop-file-utils dbus
      - name: Build locked release binary
        run: cargo +1.91.1 build --locked --release --bin mgbrowser --example journey_server --example runtime_smoke --example runtime_moves_smoke --example target_lifecycle_smoke
      - name: Package and verify the user payload
        env:
          RUSTUP_TOOLCHAIN: 1.91.1
        run: |
          test "$GITHUB_REF_NAME" = "v$(target/release/mgbrowser --version | cut -d ' ' -f 2)"
          python3 tools/test_gzip_release.py
          python3 tools/test_chrome_update_smoke.py
          python3 -B tools/test_runtime_smoke.py
          python3 -B tools/test_target_lifecycle_smoke.py
          cargo +1.91.1 test --locked --release -p mg-browser --test script_automation
          bash tools/package-release.sh
          python3 tools/release-smoke.py tmp/release
          MGBROWSER_TEST_RELEASE=tmp/release/mgbrowser-linux-x86_64.tar.gz cargo +1.91.1 test --locked -p mg-browser --lib updater::tests::packaged_update_smoke -- --ignored
          cargo +1.91.1 build --locked --example journey_server --example chrome_smoke --example cdp_journey --example lifecycle_journey --example physical_justify_smoke --example cssom_methods_smoke --example theme_smoke --example scale_smoke --example inspector_smoke --example tabs_smoke --example workspace_cdp_smoke
          python3 tools/page-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/task-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/error-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/rejection-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/message-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/lifecycle-services-smoke.py tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/chrome-update-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/theme-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/scale-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/inspector-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/tabs-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/workspace-cdp-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          bash tools/workspace-restart-smoke.sh tmp/release/mgbrowser-linux-x86_64/mgbrowser
          python3 tools/physical-justify-smoke.py \
            --binary tmp/release/mgbrowser-linux-x86_64/mgbrowser \
            --expected-sha "$(sha256sum tmp/release/mgbrowser-linux-x86_64/mgbrowser | cut -d ' ' -f 1)" \
            --expected-version "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" --expected-commit "$GITHUB_SHA" \
            --client target/debug/examples/physical_justify_smoke \
            --client-sha "$(sha256sum target/debug/examples/physical_justify_smoke | cut -d ' ' -f 1)" \
            --server target/debug/examples/journey_server \
            --server-sha "$(sha256sum target/debug/examples/journey_server | cut -d ' ' -f 1)" \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --font-sha "$(sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf | cut -d ' ' -f 1)"
          python3 tools/cssom-methods-smoke.py \
            --binary tmp/release/mgbrowser-linux-x86_64/mgbrowser \
            --expected-sha "$(sha256sum tmp/release/mgbrowser-linux-x86_64/mgbrowser | cut -d ' ' -f 1)" \
            --expected-version "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" --expected-commit "$GITHUB_SHA" \
            --client target/debug/examples/cssom_methods_smoke \
            --client-sha "$(sha256sum target/debug/examples/cssom_methods_smoke | cut -d ' ' -f 1)" \
            --server target/debug/examples/journey_server \
            --server-sha "$(sha256sum target/debug/examples/journey_server | cut -d ' ' -f 1)" \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --font-sha "$(sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf | cut -d ' ' -f 1)"
          target/debug/examples/journey_server > tmp/release-fixture.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:7878/ >/dev/null; then break; fi
            sleep 0.1
          done
          timeout 30s xvfb-run -a tmp/release/mgbrowser-linux-x86_64/mgbrowser http://127.0.0.1:7878/script-boa --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/release-journey
      - name: Verify packaged worker Runtime, native tab moves and target mutations
        env:
          RUSTUP_TOOLCHAIN: 1.91.1
        run: |
          for runtime_case in runtime runtime-moves target-lifecycle; do
            runtime_client="${runtime_case//-/_}_smoke"
            python3 "tools/$runtime_case-smoke.py" \
              --binary tmp/release/mgbrowser-linux-x86_64/mgbrowser \
              --expected-sha "$(sha256sum tmp/release/mgbrowser-linux-x86_64/mgbrowser | cut -d ' ' -f 1)" \
              --expected-version "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" --expected-commit "$GITHUB_SHA" \
              --client "target/release/examples/$runtime_client" \
              --client-sha "$(sha256sum "target/release/examples/$runtime_client" | cut -d ' ' -f 1)" \
              --server target/release/examples/journey_server \
              --server-sha "$(sha256sum target/release/examples/journey_server | cut -d ' ' -f 1)" \
              --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
              --font-sha "$(sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf | cut -d ' ' -f 1)"
          done
      - name: Preserve packaged page-service acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-page-services
          path: |
            tmp/page-services-smoke-*/
            tmp/task-services-smoke-*/
            tmp/error-services-smoke-*/
            tmp/rejection-services-smoke-*/
            tmp/message-services-smoke-*/
            tmp/lifecycle-services-smoke-*/
            tmp/physical-justify-smoke-*/
            tmp/cssom-methods-smoke-*/
            tmp/runtime-smoke-*/
            tmp/runtime-moves-smoke-*/
            tmp/target-lifecycle-smoke-*/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: |
            tmp/release/mgbrowser-linux-x86_64.tar.gz
            tmp/release/mgbrowser-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: release-assets
      - name: Publish normal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --latest --title "mgbrowser $GITHUB_REF_NAME Experimental Preview" --notes-file "docs/RELEASE-$GITHUB_REF_NAME.md"
