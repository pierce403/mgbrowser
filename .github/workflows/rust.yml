name: Rust browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.91.1
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt
      - name: Check formatting and dependency boundary
        run: |
          cargo +1.91.1 fmt --all -- --check
          mkdir -p tmp
          rustc +1.91.1 --edition=2024 tools/check-dependencies.rs -o tmp/check-dependencies
          tmp/check-dependencies
      - name: Run browser component and interaction tests
        run: cargo +1.91.1 test --locked --all-targets
      - name: Check language, allocations, DOM and restricted workers in release mode
        run: cargo +1.91.1 test --locked --release --lib --test js_expressions --test js_allocation --test js_arrays --test js_bindings --test js_sources --test js_ast_storage --test js_static_operators --test js_static_operator_limits --test js_symbols --test js_symbol_keys --test js_symbol_limits --test js_prototypes --test js_prototype_limits --test js_errors --test js_error_limits --test js_concat --test js_concat_limits --test js_empty_arguments --test js_empty_arguments_limits --test js_function_prototypes --test js_function_prototype_limits --test js_bound_functions --test js_bound_function_limits --test js_diagnostics --test js_diagnostic_limits --test js_call_receivers --test js_producer_diagnostics --test js_producer_limits --test js_array_callbacks --test js_array_callback_limits --test js_core_intrinsics --test js_core_intrinsic_limits --test js_object_create --test js_object_create_limits --test js_dom --test script_worker --test page_events --test page_projection --test script_session
      - name: Build browser and local fixture server
        run: |
          cargo +1.91.1 build --locked --bins --examples
          timeout 15s target/debug/examples/measure_ast_storage
          timeout 5s target/debug/examples/measure_object_create
      - name: Exercise a local search and result click in an X11 window
        run: |
          target/debug/examples/journey_server > tmp/fixture-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if target/debug/examples/net_probe http://127.0.0.1:7878/ > /dev/null; then break; fi
            sleep 1
          done
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/ --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/local-journey
      - name: Exercise the real external CDP journey in an X11 window
        run: |
          set -euo pipefail
          target/debug/examples/journey_server > tmp/cdp-fixture-server.log 2>&1 &
          cdp_fixture_pid=$!
          trap 'kill "$cdp_fixture_pid" 2>/dev/null || true; wait "$cdp_fixture_pid" 2>/dev/null || true' EXIT
          fixture_ready=false
          fixture_deadline=$((SECONDS + 10))
          while (( SECONDS < fixture_deadline )); do
            kill -0 "$cdp_fixture_pid"
            if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:7878/ > /dev/null 2>&1; then
              fixture_ready=true
              break
            fi
            sleep 0.1
          done
          [[ "$fixture_ready" == true ]]
          timeout 45s xvfb-run -a bash <<'CDP'
          set -euo pipefail
          target/debug/mgbrowser http://127.0.0.1:7878/ --remote-debugging-port=0 > tmp/cdp-browser.log 2>&1 &
          cdp_browser_pid=$!
          trap 'kill "$cdp_browser_pid" 2>/dev/null || true; wait "$cdp_browser_pid" 2>/dev/null || true' EXIT
          debugger_ready=false
          debugger_deadline=$((SECONDS + 10))
          while (( SECONDS < debugger_deadline )); do
            kill -0 "$cdp_browser_pid"
            cdp_port=
            if [[ -f tmp/cdp-browser.log ]]; then
              cdp_port=$(sed -n 's#^CDP listening on ws://127.0.0.1:\([0-9][0-9]*\)/.*#\1#p' tmp/cdp-browser.log)
            fi
            if [[ -n "$cdp_port" ]] && curl --fail --silent --show-error --max-time 1 "http://127.0.0.1:$cdp_port/json/version" > tmp/cdp-version.json 2>/dev/null; then
              debugger_ready=true
              break
            fi
            sleep 0.1
          done
          [[ "$debugger_ready" == true ]]
          target/debug/examples/cdp_journey "ws://127.0.0.1:$cdp_port/devtools/page/page-1" http://127.0.0.1:7878/ tmp/cdp-journey.png 2>&1 | tee tmp/cdp-client.log
          CDP
      - name: Exercise isolated scripts, fallback recovery and external CDP
        run: |
          set -euo pipefail
          mkdir -p tmp/script-journey
          target/debug/examples/journey_server > tmp/script-journey/server.log 2>&1 &
          script_fixture_pid=$!
          trap 'kill "$script_fixture_pid" 2>/dev/null || true; wait "$script_fixture_pid" 2>/dev/null || true' EXIT
          fixture_ready=false
          fixture_deadline=$((SECONDS + 10))
          while (( SECONDS < fixture_deadline )); do
            kill -0 "$script_fixture_pid"
            if curl --fail --silent --max-time 1 http://127.0.0.1:7878/script-home > /dev/null; then fixture_ready=true; break; fi
            sleep 0.1
          done
          [[ "$fixture_ready" == true ]]
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-redirect --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-dynamic --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-dynamic
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-regexp --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-regexp
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-iteration --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-iteration
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-expressions --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-expressions
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-allocation --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-allocation
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-arrays --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-arrays
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-bindings --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-bindings
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-sources --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-sources
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-ast --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-ast
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-symbols --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-symbols
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-prototypes --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-prototypes
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-errors --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-errors
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-concat --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-concat
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-empty-arguments --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-empty-arguments
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-function-prototypes --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-function-prototypes
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-bound-functions --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-bound-functions
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-diagnostics --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-diagnostics
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-producers --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-producers
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-array-callbacks --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-array-callbacks
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-core-intrinsics --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-core-intrinsics
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-static-operators --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-static-operators
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-object-create --enable-scripts --smoke-search 'Rust & café' --exit-after-smoke --evidence-dir tmp/script-journey/native-object-create
          timeout 50s xvfb-run -a bash <<'SCRIPT_CDP'
          set -euo pipefail
          target/debug/mgbrowser http://127.0.0.1:7878/script-home --enable-scripts --remote-debugging-port=0 > tmp/script-journey/browser.log 2>&1 &
          script_browser_pid=$!
          trap 'kill "$script_browser_pid" 2>/dev/null || true; wait "$script_browser_pid" 2>/dev/null || true' EXIT
          debugger_ready=false
          debugger_deadline=$((SECONDS + 10))
          while (( SECONDS < debugger_deadline )); do
            kill -0 "$script_browser_pid"
            script_port=
            if [[ -f tmp/script-journey/browser.log ]]; then
              script_port=$(sed -n 's#^CDP listening on ws://127.0.0.1:\([0-9][0-9]*\)/.*#\1#p' tmp/script-journey/browser.log)
            fi
            if [[ -n "$script_port" ]] && curl --fail --silent --max-time 1 "http://127.0.0.1:$script_port/json/version" > /dev/null; then debugger_ready=true; break; fi
            sleep 0.1
          done
          [[ "$debugger_ready" == true ]]
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-loop"}},{"method":"DOM.getDocument","params":{"depth":-1}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/loop.png > tmp/script-journey/loop.json
          grep -F 'JavaScript fuel exhausted' tmp/script-journey/browser.log
          grep -F 'Fallback content remains readable' tmp/script-journey/loop.json > /dev/null
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-home tmp/script-journey/cdp-destination.png 2>&1 | tee tmp/script-journey/cdp-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-dynamic"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/dynamic-home.png > tmp/script-journey/dynamic-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-dynamic tmp/script-journey/cdp-dynamic-destination.png 2>&1 | tee tmp/script-journey/cdp-dynamic-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-regexp"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/regexp-home.png > tmp/script-journey/regexp-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-regexp tmp/script-journey/cdp-regexp-destination.png 2>&1 | tee tmp/script-journey/cdp-regexp-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-iteration"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/iteration-home.png > tmp/script-journey/iteration-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-iteration tmp/script-journey/cdp-iteration-destination.png 2>&1 | tee tmp/script-journey/cdp-iteration-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-expressions"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/expressions-home.png > tmp/script-journey/expressions-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-expressions tmp/script-journey/cdp-expressions-destination.png 2>&1 | tee tmp/script-journey/cdp-expressions-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-allocation"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/allocation-home.png > tmp/script-journey/allocation-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-allocation tmp/script-journey/cdp-allocation-destination.png 2>&1 | tee tmp/script-journey/cdp-allocation-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-arrays"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/arrays-home.png > tmp/script-journey/arrays-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-arrays tmp/script-journey/cdp-arrays-destination.png 2>&1 | tee tmp/script-journey/cdp-arrays-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-bindings"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/bindings-home.png > tmp/script-journey/bindings-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-bindings tmp/script-journey/cdp-bindings-destination.png 2>&1 | tee tmp/script-journey/cdp-bindings-client.log
          SCRIPT_CDP
          # Keep eight journeys per owned browser batch; the growing corpus must
          # not share one fixed deadline. All checks and worker limits remain.
          timeout 50s xvfb-run -a bash <<'STORAGE_CDP'
          set -euo pipefail
          target/debug/mgbrowser http://127.0.0.1:7878/script-sources --enable-scripts --remote-debugging-port=0 > tmp/script-journey/storage-browser.log 2>&1 &
          script_browser_pid=$!
          trap 'kill "$script_browser_pid" 2>/dev/null || true; wait "$script_browser_pid" 2>/dev/null || true' EXIT
          debugger_ready=false
          debugger_deadline=$((SECONDS + 10))
          while (( SECONDS < debugger_deadline )); do
            kill -0 "$script_browser_pid"
            script_port=
            if [[ -f tmp/script-journey/storage-browser.log ]]; then
              script_port=$(sed -n 's#^CDP listening on ws://127.0.0.1:\([0-9][0-9]*\)/.*#\1#p' tmp/script-journey/storage-browser.log)
            fi
            if [[ -n "$script_port" ]] && curl --fail --silent --max-time 1 "http://127.0.0.1:$script_port/json/version" > /dev/null; then debugger_ready=true; break; fi
            sleep 0.1
          done
          [[ "$debugger_ready" == true ]]
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-sources"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/sources-home.png > tmp/script-journey/sources-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-sources tmp/script-journey/cdp-sources-destination.png 2>&1 | tee tmp/script-journey/cdp-sources-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-ast"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/ast-home.png > tmp/script-journey/ast-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-ast tmp/script-journey/cdp-ast-destination.png 2>&1 | tee tmp/script-journey/cdp-ast-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-symbols"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/symbols-home.png > tmp/script-journey/symbols-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-symbols tmp/script-journey/cdp-symbols-destination.png 2>&1 | tee tmp/script-journey/cdp-symbols-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-prototypes"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/prototypes-home.png > tmp/script-journey/prototypes-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-prototypes tmp/script-journey/cdp-prototypes-destination.png 2>&1 | tee tmp/script-journey/cdp-prototypes-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-errors"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/errors-home.png > tmp/script-journey/errors-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-errors tmp/script-journey/cdp-errors-destination.png 2>&1 | tee tmp/script-journey/cdp-errors-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-concat"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/concat-home.png > tmp/script-journey/concat-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-concat tmp/script-journey/cdp-concat-destination.png 2>&1 | tee tmp/script-journey/cdp-concat-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-empty-arguments"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/empty-arguments-home.png > tmp/script-journey/empty-arguments-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-empty-arguments tmp/script-journey/cdp-empty-arguments-destination.png 2>&1 | tee tmp/script-journey/cdp-empty-arguments-client.log
          target/debug/examples/cdp_command "ws://127.0.0.1:$script_port/devtools/page/page-1" '[{"method":"Page.navigate","params":{"url":"http://127.0.0.1:7878/script-function-prototypes"}},{"method":"Page.captureScreenshot"}]' --screenshot tmp/script-journey/function-prototypes-home.png > tmp/script-journey/function-prototypes-home.json
          target/debug/examples/cdp_journey "ws://127.0.0.1:$script_port/devtools/page/page-1" http://127.0.0.1:7878/script-function-prototypes tmp/script-journey/cdp-function-prototypes-destination.png 2>&1 | tee tmp/script-journey/cdp-function-prototypes-client.log
          STORAGE_CDP
          timeout 50s xvfb-run -a bash <<'BOUND_CDP'
          set -euo pipefail
          target/debug/mgbrowser http://127.0.0.1:7878/script-bound-functions --enable-scripts --remote-debugging-port=0 > tmp/script-journey/bound-browser.log 2>&1 &
          script_browser_pid=$!
          trap 'kill "$script_browser_pid" 2>/dev/null || true; wait "$script_browser_pid" 2>/dev/null || true' EXIT
          debugger_ready=false
          debugger_deadline=$((SECONDS + 10))
          while (( SECONDS < debugger_deadline )); do
            kill -0 "$script_browser_pid"
            script_port=
            if [[ -f tmp/script-journey/bound-browser.log ]]; then
              script_port=$(sed -n 's#^CDP listening on ws://127.0.0.1:\([0-9][0-9]*\)/.*#\1#p' tmp/script-journey/bound-browser.log)
            fi
            if [[ -n "$script_port" ]] && curl --fail --silent --max-time 1 "http://127.0.0.1:$script_port/json/version" > /dev/null; then debugger_ready=true; break; fi
            sleep 0.1
          done
          [[ "$debugger_ready" == true ]]
