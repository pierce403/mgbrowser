      - name: Exercise retained click and submit handlers over native input and CDP
        run: |
          set -euo pipefail
          mkdir -p tmp/event-journey
          target/debug/examples/journey_server > tmp/event-journey/server.log 2>&1 &
          event_fixture_pid=$!
          trap 'kill "$event_fixture_pid" 2>/dev/null || true; wait "$event_fixture_pid" 2>/dev/null || true' EXIT
          event_ready=false
          event_deadline=$((SECONDS + 10))
          while (( SECONDS < event_deadline )); do
            kill -0 "$event_fixture_pid"
            if curl --fail --silent --max-time 1 http://127.0.0.1:7878/script-events > /dev/null; then event_ready=true; break; fi
            sleep 0.1
          done
          [[ "$event_ready" == true ]]
          timeout 30s xvfb-run -a target/debug/mgbrowser http://127.0.0.1:7878/script-events --enable-scripts --smoke-events --exit-after-smoke --evidence-dir tmp/event-journey/native 2>&1 | tee tmp/event-journey/native.log
          timeout 45s xvfb-run -a bash <<'EVENT_CDP'
          set -euo pipefail
          target/debug/mgbrowser http://127.0.0.1:7878/script-events --enable-scripts --remote-debugging-port=0 > tmp/event-journey/browser.log 2>&1 &
          event_browser_pid=$!
          trap 'kill "$event_browser_pid" 2>/dev/null || true; wait "$event_browser_pid" 2>/dev/null || true' EXIT
          event_debugger_ready=false
          event_debugger_deadline=$((SECONDS + 10))
          while (( SECONDS < event_debugger_deadline )); do
            kill -0 "$event_browser_pid"
            event_port=
            if [[ -f tmp/event-journey/browser.log ]]; then
              event_port=$(sed -n 's#^CDP listening on ws://127.0.0.1:\([0-9][0-9]*\)/.*#\1#p' tmp/event-journey/browser.log)
            fi
            if [[ -n "$event_port" ]] && curl --fail --silent --max-time 1 "http://127.0.0.1:$event_port/json/version" > /dev/null; then event_debugger_ready=true; break; fi
            sleep 0.1
          done
          [[ "$event_debugger_ready" == true ]]
          target/debug/examples/cdp_journey "ws://127.0.0.1:$event_port/devtools/page/page-1" http://127.0.0.1:7878/script-events tmp/event-journey/destination.png 2>&1 | tee tmp/event-journey/client.log
          EVENT_CDP
          if grep -F '/event-trap' tmp/event-journey/server.log; then exit 1; fi
          [[ $(grep -cFx '200 OK /event-search' tmp/event-journey/server.log) == 2 ]]
          [[ $(grep -cFx '200 OK /event-destination' tmp/event-journey/server.log) == 2 ]]
      - name: Preserve rendered local journey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-journey
          path: |
            tmp/local-journey
            tmp/fixture-server.log
            tmp/cdp-journey.png
            tmp/cdp-fixture-server.log
            tmp/cdp-browser.log
            tmp/cdp-client.log
            tmp/cdp-version.json
            tmp/script-journey
            tmp/event-journey
