[package]
name = "mg-deps"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Experimental Rust-only browser dependency foundation"
license = "MIT"
repository = "https://github.com/pierce403/mgbrowser"
homepage = "https://mgbrowser.org"

[[bin]]
name = "mgbrowser"
path = "src/main.rs"

[dependencies]
# Never enable rustls's default aws-lc-rs provider or ring.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "70f76c039e587192688af18a80d5d6435dedaf22", default-features = false, features = ["std", "tls12", "zeroize"] }
# Explicit codec allowlist. Add formats only after auditing the resolved graph.
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = { version = "0.9", default-features = false }
rustybuzz = { version = "0.20", default-features = false, features = ["std"] }
url = "2"
webpki-roots = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Rust X11 protocol implementation: no Xlib/XCB FFI or toolkit renderer.
x11rb = { version = "0.13", default-features = false }
psl = "2"
httpdate = "1"
# CDP is loopback-only; WebSocket handshake/JSON stay in Rust, without TLS backends.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Rust declarations for Linux process/resource/syscall controls, not a native engine.
libc = "0.2"
